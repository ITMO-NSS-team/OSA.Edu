name: osa-edu-dev

services:
  backend:
    image: osa-edu-backend:dev
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8787"
      WEB_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports:
      - "8787:8787"
    volumes:
      - .:/app
      - backend_data:/app/data
    command: python -m uvicorn backend.app.main:app --reload --host 0.0.0.0 --port 8787

  frontend:
    image: osa-edu-frontend:dev
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8787
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: npm exec vite -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  backend_data:
  frontend_node_modules:
